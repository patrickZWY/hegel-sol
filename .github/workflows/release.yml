name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Verify and release Linux binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          components: rustfmt,clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: typos-cli
      - name: Verify source and tests
        run: |
          cargo x lint
          cargo x build --locked
          cargo x test
      - name: Build release binary
        run: cargo build --release --locked -p hegel-sol
      - name: Package binary and checksum
        run: |
          mkdir -p dist
          cp target/release/hegel-sol dist/hegel-sol-linux-x86_64
          sha256sum dist/hegel-sol-linux-x86_64 > dist/hegel-sol-linux-x86_64.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/hegel-sol-linux-x86_64
          dist/hegel-sol-linux-x86_64.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
