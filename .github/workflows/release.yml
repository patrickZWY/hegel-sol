name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Verify and release Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.3.6
      - name: Verify source and tests
        run: ./scripts/ci.sh
      - name: Build release binary
        run: cargo build --release --locked -p hegel-sol
      - name: Package binary and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/hegel-sol dist/hegel-sol-linux-x86_64
          sha256sum dist/hegel-sol-linux-x86_64 > dist/hegel-sol-linux-x86_64.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/hegel-sol-linux-x86_64
          dist/hegel-sol-linux-x86_64.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
