name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request, or per push when not on a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          components: rustfmt,clippy
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: typos-cli
      - run: cargo x lint

  test:
    name: Test (Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        # The first entry is the MSRV declared as rust-version in Cargo.toml.
        rust: ["1.94.1", stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: ${{ matrix.rust }}
      - run: cargo x build --locked
      - run: cargo x test

  # Branch protection requires this one job, so adding or renaming the jobs
  # above never needs a settings change.
  required:
    name: Required
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: [lint, test]
    steps:
      - name: Check that every required job succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.test.result }}" != "success" ]]; then
            echo "Required jobs have not all succeeded."
            exit 1
          fi
