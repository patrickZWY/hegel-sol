[workspace]
resolver = "3"
members = ["crates/hegel-sol", "crates/tests-integration", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/patrickZWY/hegel-sol"
rust-version = "1.94.1"

[workspace.dependencies]
# Workspace crates
hegel-sol = { path = "crates/hegel-sol" }

# Engine and EVM
hegeltest-c = "=0.42.3"
revm = { version = "43", default-features = false, features = ["std"] }
alloy-json-abi = "1.7"
alloy-dyn-abi = "1.7"
alloy-primitives = "1.7"

# CLI, serialisation, errors
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unknown_lints = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.dev]
opt-level = 1
