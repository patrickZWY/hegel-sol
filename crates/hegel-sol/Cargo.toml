[package]
name = "hegel-sol"
version = "0.1.0"
edition = "2024"
description = "Property-based testing for Solidity, built on Hegel (Hypothesis)"
license = "MIT"

[[bin]]
name = "hegel-sol"
path = "src/main.rs"

[dependencies]
hegeltest-c = "=0.42.3"
revm = { version = "43", default-features = false, features = ["std"] }
alloy-json-abi = "1.7"
alloy-dyn-abi = "1.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
